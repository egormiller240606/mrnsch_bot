name: Daily Football Schedule

on:
  schedule:
    - cron: '44 10 * * *'  # 13:33 МСК (10:33 UTC)
  workflow_dispatch:

jobs:
  send-schedule:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # Актуальная версия для Node24

      - name: Set up Python
        uses: actions/setup-python@v5 # Актуальная версия для Node24
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install python-telegram-bot requests

      - name: Run bot script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python bot.py
